[package]
name = "virtuel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Virtual files: a selection of the server shown as a folder, downloaded on demand"

[dependencies]
api_immich = { path = "../api_immich" }
futures-util = "0.3.34"
hex = "0.4.3"
humantime = "2.4.0"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "fs", "io-util", "rt", "macros", "time"] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
cloud-filter = "0.0.7"

[dev-dependencies]
hex = "0.4.3"
sha1 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
