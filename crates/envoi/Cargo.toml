[package]
name = "envoi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Upload engine: local folders sent to Immich, with a persistent queue"

[dependencies]
api_immich = { path = "../api_immich" }
futures-util = "0.3.34"
hex = "0.4.3"
humantime = "2.4.0"
notify = "8"
serde_json = "1.0.154"
fs4 = "1"
trash = "5.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "fs", "time", "rt", "macros"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
