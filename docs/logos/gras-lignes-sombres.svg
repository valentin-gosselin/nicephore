<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nicéphore: Niépce's "View from the Window at Le Gras" (about 1827) as a
       leaning De Stijl grid. The left wing under its roof, the large lit roof
       rising towards the tower, the tower with its pointed roof, three pieces
       of sky. Every zone in colour, as a nod to the photo library family;
       own shape and own hues, not the Immich or Google logos. -->
  <defs>
    <clipPath id="tuile">
      <rect x="64" y="64" width="896" height="896" rx="208"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tuile)">
    <polygon points="0,0 340,0 332,303 0,170" fill="#e86fa8"/>
    <polygon points="0,170 332,303 321,692 0,780" fill="#e8503f"/>
    <polygon points="0,780 321,692 312,1024 0,1024" fill="#25ad6e"/>
    <polygon points="340,0 700,0 690,592 321,692" fill="#8ec3f0"/>
    <polygon points="321,692 690,592 682,1024 312,1024" fill="#f2b52e"/>
    <polygon points="700,0 1024,0 1024,330 840,215 693,380" fill="#f7d98c"/>
    <polygon points="693,380 840,215 1024,330 1024,1024 682,1024" fill="#2f86e0"/>
    <!-- Slanted lines end on the verticals' centre lines with butt caps;
         the verticals are drawn last and cover the joints. -->
    <g fill="none" stroke="#1b1c1f" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter">
      <line x1="0" y1="780" x2="690" y2="592"/>
      <line x1="0" y1="170" x2="332" y2="303"/>
      <polyline points="693,380 840,215 1024,330"/>
      <line x1="340" y1="0" x2="312" y2="1024"/>
      <line x1="700" y1="0" x2="682" y2="1024"/>
    </g>
  </g>
</svg>
