# Disposable Immich server for write tests (albums, people, trash...).
# Never point the tests at a real library. Started by scripts/immich-jetable.sh.
name: nicephore-immich-jetable

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.6}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - ${DONNEES:?}/upload:/data
    ports:
      - "127.0.0.1:${PORT:-2299}:2283"
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    restart: on-failure

  redis:
    image: docker.io/valkey/valkey:9

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DONNEES:?}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
