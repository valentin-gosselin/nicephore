<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nicéphore: a greyscale pewter plate framing rooftops under the sun, after
       Niépce's "View from the Window at Le Gras" (heliography, about 1827). -->
  <defs>
    <linearGradient id="etain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d41"/>
      <stop offset="1" stop-color="#1e2023"/>
    </linearGradient>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c2f"/>
      <stop offset="1" stop-color="#4a4d51"/>
    </linearGradient>
    <clipPath id="plaque">
      <rect x="184" y="184" width="656" height="656" rx="76"/>
    </clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#etain)"/>
  <rect x="70" y="70" width="884" height="884" rx="202" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12"/>
  <g clip-path="url(#plaque)">
    <rect x="184" y="184" width="656" height="656" fill="url(#ciel)"/>
    <circle cx="644" cy="372" r="96" fill="#ececec"/>
    <path d="M150 860 L150 715 L310 585 L470 715 L470 860 Z" fill="#b4b7bb"/>
    <path d="M540 860 L540 700 L880 615 L880 860 Z" fill="#7d8085"/>
    <!-- Window mullions: the picture is a view from a window. -->
    <rect x="494" y="184" width="36" height="656" fill="#5c5f63"/>
    <rect x="184" y="494" width="656" height="36" fill="#5c5f63"/>
  </g>
  <rect x="184" y="184" width="656" height="656" rx="76" fill="none" stroke="#d0d2d5" stroke-opacity="0.28" stroke-width="10"/>
</svg>
