[package]
name = "nicephore"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Unofficial desktop client for Immich"

[lib]
name = "nicephore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
api_immich = { path = "../../crates/api_immich" }
axum = "0.8.9"
bytes = "1.12.1"
cache_vignettes = { path = "../../crates/cache_vignettes" }
envoi = { path = "../../crates/envoi" }
futures-util = "0.3.34"
keyring = "4.2.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
