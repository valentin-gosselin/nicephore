[package]
name = "nicephore"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Unofficial desktop client for Immich"

[lib]
name = "nicephore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
api_immich = { path = "../../crates/api_immich" }
argon2 = "0.6.0"
axum = "0.8.9"
bytes = "1.12.1"
cache_vignettes = { path = "../../crates/cache_vignettes" }
chacha20poly1305 = "0.11.0"
envoi = { path = "../../crates/envoi" }
fs4 = "1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = "4.2.0"
rand = "0.10.3"
sha1 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
dirs = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
