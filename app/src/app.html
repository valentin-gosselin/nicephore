<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Dark until the system theme is known, unless light was chosen:
      // avoids a white flash on dark desktops.
      try {
        if (localStorage.getItem('nicephore-theme') !== 'clair') document.documentElement.classList.add('dark');
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
